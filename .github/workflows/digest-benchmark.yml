name: First-party Python digest benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - digest-review.py
      - benchmark/score_python.py
      - .github/workflows/digest-benchmark.yml
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OWASP-Benchmark/BenchmarkPython
          ref: f1291485808b66e20ddb6b01b10dc71b3df8c8ba
          path: public-lab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python digest-review.py test
      - name: Evaluate frozen first-party reviewer against official labels
        run: |
          mkdir -p benchmark-output
          python digest-review.py review public-lab/testcode --authorized-local > benchmark-output/digest.json
          python benchmark/score_python.py public-lab/expectedresults-0.1.csv benchmark-output/digest.json public-lab/testcode > benchmark-output/summary.json
          cat benchmark-output/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: digest-benchmark-summary
          path: benchmark-output/summary.json
          if-no-files-found: error
