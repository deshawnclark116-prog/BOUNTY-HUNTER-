name: Offline regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node bounty.js test
      - run: node bounty.js practice examples/practice.json
      - run: |
          set +e
          node bounty.js review examples/policy.json
          status=$?
          test "$status" -eq 2
      - run: node research.js test
      - run: node research.js benchmark
      - run: node kube-review.js test
      - run: |
          set +e
          node kube-review.js audit examples/kube-demo.json --authorized-local
          status=$?
          test "$status" -eq 3
      - run: node remediation.js test
      - run: python3 benchmark/compare_python.py test
      - run: node dependency-review.js
      - run: node local-assessment.js test
      - run: node policy-model.js test
      - run: node benchmark/policy-differential.js
      - run: node benchmark/policy-exhaustive.js
      - run: node conditional-policy.js test
      - run: node benchmark/conditional-limits.js
      - run: node benchmark/conditional-fresh.js
