name: Independent OPA policy comparison
on:
  workflow_dispatch:
  push:
    paths:
      - conditional-policy.js
      - benchmark/opa-compare.js
      - benchmark/profile-threeway.js
      - benchmark/casbin-profile.py
      - .github/workflows/opa-comparison.yml
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: open-policy-agent/opa
          ref: 7b037a97dd9b465dedb1c565f778ea06ac5569ea
          path: opa-reference
          persist-credentials: false
          sparse-checkout: |
            docs/docs/http-api-authorization.md
            docs/docs/policy-testing.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OPA comparison executable
        run: |
          mkdir -p "$RUNNER_TEMP/opa-bin"
          cd "$RUNNER_TEMP/opa-bin"
          curl --fail --silent --show-error --location -O https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static
          curl --fail --silent --show-error --location -O https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static.sha256
          sha256sum --check opa_linux_amd64_static.sha256
          mv opa_linux_amd64_static opa
          chmod +x opa
          echo "$RUNNER_TEMP/opa-bin" >> "$GITHUB_PATH"
      - name: Compare local policy decisions
        run: |
          opa version
          node benchmark/opa-compare.js opa-reference/docs/docs/http-api-authorization.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned second comparison engine
        run: python -m pip install casbin==1.36.0
      - name: Compare three engines on independent profile example
        run: node benchmark/profile-threeway.js opa-reference/docs/docs/policy-testing.md
