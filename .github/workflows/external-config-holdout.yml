name: Frozen external configuration holdout
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmark/external-config-holdout.py'
      - '.github/workflows/external-config-holdout.yml'
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: semgrep/semgrep-rules
          ref: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          path: upstream-fixtures
          sparse-checkout: python
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen engine inputs
        run: |
          git diff --exit-code 63387dc87d151ea81b14b6a0243435370ffffe4f HEAD -- digest-review.py python-defaults-review.py source-policy.py || exit 1
        # checkout history is needed for the comparison above
      - run: python benchmark/external-config-holdout.py upstream-fixtures
