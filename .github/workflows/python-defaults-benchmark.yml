name: Python secure defaults benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - python-defaults-review.py
      - digest-review.py
      - benchmark/score_python.py
      - .github/workflows/python-defaults-benchmark.yml
permissions:
  contents: read
jobs:
  defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OWASP-Benchmark/BenchmarkPython
          ref: f1291485808b66e20ddb6b01b10dc71b3df8c8ba
          path: public-lab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python python-defaults-review.py test
      - name: Evaluate local policy observations against published lab labels
        run: |
          mkdir -p benchmark-output
          python python-defaults-review.py review public-lab/testcode --authorized-local > benchmark-output/defaults.json
          python digest-review.py review public-lab/testcode --authorized-local > benchmark-output/digest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmark-output")
          a=json.loads((p/"digest.json").read_text())
          b=json.loads((p/"defaults.json").read_text())
          combined={"metrics":{k:{} for k in a["metrics"].keys() & b["metrics"].keys()},"errors":a["errors"]+b["errors"],"results":a["results"]+b["results"]}
          (p/"combined.json").write_text(json.dumps(combined))
          PY
          python benchmark/score_python.py public-lab/expectedresults-0.1.csv benchmark-output/combined.json public-lab/testcode > benchmark-output/summary.json
          cat benchmark-output/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-defaults-benchmark-summary
          path: benchmark-output/summary.json
          if-no-files-found: error
